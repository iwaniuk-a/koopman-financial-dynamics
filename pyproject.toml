    { name = "iwaniuk-a", email = "olaiwaniuk04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arch>=8.0.0",
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
